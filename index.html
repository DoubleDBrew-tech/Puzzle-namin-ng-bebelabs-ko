<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Para kay Leigh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Welcome Modal -->
  <div id="welcomeScreen">
    <div id="heartsContainer"></div>
    <div class="welcome-card">
      <h1>💖 Live, Laugh, Love Leigh 💖</h1>
      <p>Enter your name!</p>
      <input type="text" id="playerNameInput" placeholder="Enter your name..." maxlength="15">
      <button id="enterGameBtn">Start Playing ❤️</button>
    </div>
  </div>

  <!-- Hint Image Modal -->
  <div id="hintModal" class="modal">
    <div class="modal-content">
      <span id="closeHint" class="close-btn">&times;</span>
      <h2>🧩 Hint </h2>
      <img id="hintImage" src="" alt="Puzzle Reference">
    </div>
  </div>

  <!-- History & Achievements Modal -->
  <div id="historyModal" class="modal">
    <div class="modal-content">
      <span id="closeHistory" class="close-btn">&times;</span>
      <h2>🏆 Solved Puzzle History</h2>
      <div id="historyStats">Loading history...</div>
    </div>
  </div>

  <!-- Header & Controls -->
  <header>
    <h1>💖 Live, Laugh, Love Leigh 💖</h1>
    <div id="playerBar">
      <span>Logged in as: <strong id="displayName"></strong></span>
      <button id="leaveBtn" class="sec-btn">Leave Game</button>
    </div>
  </header>
  
  <div id="controls">
    <label for="gridSelect"><strong>Pieces:</strong></label>
    <select id="gridSelect">
      <option value="2">2x2 (4 pieces)</option>
      <option value="3">3x3 (9 pieces)</option>
      <option value="4" selected>4x4 (16 pieces)</option>
      <option value="6">6x6 (36 pieces)</option>
      <option value="10">10x10 (100 pieces)</option>
    </select>

    <input type="file" id="imageUpload" accept="image/*">
    <button id="uploadBtn">Upload & Start</button>
    <button id="resetBtn" class="sec-btn">Reset Puzzle</button>
    <button id="hintBtn" class="action-btn">💡 Hint</button>
    <button id="finishBtn" class="finish-btn">✅ Finish Puzzle</button>
    <button id="historyBtn" class="action-btn">🏆 History</button>
  </div>
  
  <div id="gameStatus">Select pieces & upload an image!</div>

  <div id="gameContainer">
    <div id="board"></div>
    <div id="tray"></div>
  </div>

  <script type="module" src="script.js?v=4"></script>
</body>
</html>
