<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bebelabs Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>💖 Bebelabs Puzzle 💖</h1>
  
  <div id="controls">
    <input type="file" id="imageUpload" accept="image/*">
    <button id="uploadBtn">Upload & Start New Puzzle</button>
    <button id="resetBtn">Reset Current Puzzle</button>
  </div>
  
  <div id="gameStatus">Upload an image to start!</div>

  <div id="gameContainer">
    <div id="board"></div>
    <div id="tray"></div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
